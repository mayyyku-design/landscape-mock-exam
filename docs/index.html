<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>景觀高考模擬考</title>
  <style>
    :root{--ink:#173042;--muted:#6e7e87;--cream:#f6f2ea;--paper:#fffdf8;--teal:#167d78;--mint:#dcefeb;--orange:#e88748;--line:#ded8cc;--shadow:0 14px 40px #17304212}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif}button,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.rail{width:250px;background:var(--ink);color:#fff;padding:30px 22px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:800;letter-spacing:.04em}.brand small{display:block;color:#a9c6c2;font-size:12px;font-weight:500;margin-top:8px}.rail h4{color:#a9c6c2;font-size:12px;letter-spacing:.15em;margin:42px 0 12px}.rail label{display:block;font-size:12px;color:#cbdad8;margin:15px 0 7px}.rail select{width:100%;border:1px solid #40606d;background:#214556;color:#fff;border-radius:10px;padding:10px}.rail-note{margin-top:40px;padding:13px;border:1px solid #40606d;border-radius:12px;color:#bad0cf;font-size:12px;line-height:1.7}.main{flex:1;padding:40px clamp(22px,5vw,72px);max-width:1500px;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--teal);font-weight:800}.top h1{font-size:clamp(30px,5vw,58px);line-height:1.1;margin:12px 0 10px;letter-spacing:-.06em}.lead{color:var(--muted);margin:0;line-height:1.7}.start{background:var(--teal);color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:800;box-shadow:0 8px 18px #167d7835}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:34px 0}.stat{background:var(--paper);border:1px solid var(--line);padding:18px;border-radius:14px}.stat b{display:block;font-size:27px;margin-bottom:6px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:30px 0 16px}.toolbar h2{margin:0;font-size:20px}.count{font-size:13px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:245px}.card-head{display:flex;justify-content:space-between;gap:14px}.year{font-size:28px;font-weight:800}.type{font-size:12px;color:var(--teal);font-weight:800;margin-top:4px}.status{font-size:11px;padding:5px 8px;border-radius:99px;height:max-content;background:var(--mint);color:#176c68}.status.paper{background:#fff0df;color:#a75a22}.card p{color:var(--muted);font-size:13px;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}.chip{font-size:11px;background:#eef2ee;color:#45615e;border-radius:99px;padding:6px 9px}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1;border-radius:9px;padding:10px 8px;border:1px solid var(--line);background:white;color:var(--ink);font-size:12px;font-weight:700}.actions .primary{border-color:var(--teal);background:var(--teal);color:white}.empty{padding:40px;background:var(--paper);border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;grid-column:1/-1}.modal-wrap{position:fixed;inset:0;background:#0e2430a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-wrap.show{display:flex}.modal{background:var(--paper);width:min(980px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:26px;box-shadow:0 20px 80px #102a36aa}.modal-top{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:17px}.modal h2{margin:0 0 7px}.close{border:0;background:#eef2ef;border-radius:50%;width:34px;height:34px;color:var(--ink)}.exam-meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.exam-meta span{background:#edf4f1;border-radius:8px;padding:8px 10px;font-size:12px}.question{border:1px solid var(--line);border-radius:13px;padding:17px;margin:14px 0}.question h3{font-size:15px;line-height:1.6;margin:0 0 12px}.options{display:grid;gap:8px}.options label{display:block;padding:10px;border:1px solid #e5e0d5;border-radius:9px;font-size:13px}.options label:has(input:checked){border-color:var(--teal);background:#e9f4f1}.essay{width:100%;min-height:145px;border:1px solid var(--line);border-radius:9px;padding:12px;resize:vertical}.timer{font-size:18px;font-weight:800;color:var(--orange)}.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}.modal-footer button{border:0;border-radius:10px;padding:11px 16px;background:var(--teal);color:#fff;font-weight:800}.notice{font-size:12px;color:var(--muted);line-height:1.7;background:#faf6eb;padding:12px;border-radius:10px;margin:15px 0}.source-link{color:var(--teal);font-weight:800;text-decoration:none}
    @media(max-width:800px){.shell{display:block}.rail{width:auto;height:auto;position:static;padding:22px}.rail h4{margin-top:22px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.rail-note{display:none}.main{padding:28px 18px}.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.top .start{margin-top:18px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">景觀高考模擬考<small>LANDSCAPE EXAM STUDIO</small></div>
      <h4>篩選題庫</h4>
      <div class="filters">
        <label for="year">年度</label><select id="year"><option value="all">全部年度</option><option>113</option><option>114</option><option>115</option></select>
        <label for="type">考試類型</label><select id="type"><option value="all">全部類型</option><option>高考三級</option><option>地方特考三等</option></select>
        <label for="subject">科目</label><select id="subject"><option value="all">全部科目</option><option>共同科目</option><option>景觀植物學與景觀生態學</option><option>景觀規劃</option><option>景觀工程</option><option>景觀與都市設計</option></select>
      </div>
      <div class="rail-note">原卷資料依考試院公開試題與答案整理。申論及作圖科目以計時作答、自評與原卷檢視為主。</div>
    </aside>
    <main class="main">
      <div class="top"><div><div class="eyebrow">113 — 115 · 高考三級／地方特考三等</div><h1>把考古題，<br><em>變成你的練習場。</em></h1><p class="lead">依年度、考試類型與科目快速進入模擬考。先計時作答，再回看原卷檢核。</p></div><button class="start" id="randomStart">隨機抽一場</button></div>
      <section class="stats"><div class="stat"><b>40</b><span>份官方原卷與答案</span></div><div class="stat"><b>5</b><span>個考試年度／場次</span></div><div class="stat"><b>6</b><span>類科目練習</span></div><div class="stat"><b>自評</b><span>申論與作圖作答模式</span></div></section>
      <div class="toolbar"><h2>考試場次</h2><div class="count" id="count"></div></div>
      <section class="cards" id="cards"></section>
    </main>
  </div>
  <div class="modal-wrap" id="modalWrap"><div class="modal"><div class="modal-top"><div><div class="eyebrow" id="modalKicker"></div><h2 id="modalTitle"></h2><div class="timer" id="timer">剩餘 60:00</div></div><button class="close" id="closeModal">×</button></div><div id="modalBody"></div><div class="modal-footer"><a id="paperLink" class="source-link" target="_blank">查看官方原卷 ↗</a><button id="finish">完成本次模擬</button></div></div></div>
  <script>
    const subjects=['國文','法學知識與英文','景觀植物學與景觀生態學','景觀規劃','景觀工程','景觀與都市設計'];
    const common=new Set(['國文','法學知識與英文']);
    const records=[
      {year:'113',type:'高考三級'},{year:'113',type:'地方特考三等'},{year:'114',type:'高考三級'},{year:'114',type:'地方特考三等'},{year:'115',type:'高考三級'}
    ].map(x=>({...x,subjects}));
    const prompts={
      '景觀植物學與景觀生態學':['說明生態檢核在景觀工程生命週期中的角色，並提出源／匯概念的應用方式。','何謂自生植物？請說明其與原生植物、外來種的差異。','請說明綠容率、等效綠覆面積與立體綠化的關係。','請以基地條件為前提，提出提升都市生物多樣性的植物配置策略。'],
      '景觀規劃':['請說明淨零排放與自然碳匯在景觀規劃中的關聯，並提出可操作的規劃策略。','都市農地景觀有哪些規劃價值？請以空間、社會與生態面向分析。','說明多因素土地使用適宜性分析的流程，並舉例說明評估因子。','請提出一套景觀規劃案的視覺衝擊評估架構。'],
      '景觀工程':['請說明景觀工程管理導入BIM的效益、限制與推動要點。','請繪圖並說明步道排水的基本構造與防滑、維護考量。','請比較智慧型雨水花園與傳統雨水花園的設計重點。','請說明擋土牆與護坡的選擇原則及常見排水細節。'],
      '景觀與都市設計':['請說明生成式AI導入公部門景觀業務時的應用情境與治理風險。','請提出一個兼顧人本、韌性與生態的都市開放空間設計概念。','請以圖面說明都市設計案的基地分析、概念生成與設計深化流程。','請說明景觀與都市設計成果如何轉化為可執行的管制與設計準則。']
    };
    const $=s=>document.querySelector(s); let current=null, interval=null, seconds=3600;
    function paperPath(r,sub,answer=false){return `papers/${r.year}/${r.type}/${sub}_${answer?'答案':'試題'}.pdf`}
    function render(){const y=$('#year').value,t=$('#type').value,s=$('#subject').value;const list=records.filter(r=>(y==='all'||r.year===y)&&(t==='all'||r.type===t));$('#count').textContent=`顯示 ${list.length} 場考試`;$('#cards').innerHTML=list.length?list.map(r=>card(r,s)).join(''):'<div class="empty">目前沒有符合條件的考試場次。</div>';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>openExam(records[+b.dataset.start],b.dataset.subject));document.querySelectorAll('[data-paper]').forEach(a=>a.onclick=()=>window.open(paperPath(records[+a.dataset.paper],a.dataset.subject),'_blank'));}
    function card(r,selected){const active=selected==='all'?subjects:subjects.filter(s=>s===selected||selected==='共同科目'&&common.has(s));return `<article class="card"><div class="card-head"><div><div class="year">${r.year}</div><div class="type">${r.type}</div></div><span class="status ${r.year==='115'&&r.type.includes('地方')?'paper':''}">${r.year==='115'&&r.type.includes('地方')?'尚未公布':'可練習'}</span></div><p>${r.year==='115'&&r.type.includes('地方')?'考選部尚未提供該場次檔案。':'選擇科目後開始計時模擬，完成後可回看官方原卷。'}</p><div class="chips">${active.map(s=>`<span class="chip">${s.replace('景觀','')}</span>`).join('')}</div><div class="actions">${r.year==='115'&&r.type.includes('地方')?'<button disabled>等待資料</button>':`<button class="primary" data-start="${records.indexOf(r)}" data-subject="${selected==='all'?'all':selected}">開始模擬考</button><button data-paper="${records.indexOf(r)}" data-subject="${active[0]}">查看原卷</button>`}</div></article>`}
    function openExam(r,chosen){if(r.year==='115'&&r.type.includes('地方'))return;const sub=chosen==='all'||chosen==='共同科目'? (chosen==='共同科目'?'國文':'景觀規劃') : chosen;current={r,sub};seconds=3600;clearInterval(interval);interval=setInterval(()=>{seconds--;updateTimer();if(seconds<=0)finish()},1000);$('#modalKicker').textContent=`${r.year} · ${r.type}`;$('#modalTitle').textContent=sub==='all'?'綜合模擬考':sub;$('#paperLink').href=paperPath(r,sub);$('#modalBody').innerHTML=common.has(sub)?commonBody(sub):essayBody(sub);$('#modalWrap').classList.add('show');updateTimer()}
    function commonBody(sub){return `<div class="notice">這是選擇題練習介面。完成後可開啟「${sub}_答案.pdf」自行核對，並將錯題記錄回個人筆記。</div>${['請先閱讀題幹，判斷最符合題意的選項。','本題練習重點：概念辨識與關鍵字判讀。','遇到不確定的題目，先標記後再回頭檢查。'].map((q,i)=>`<div class="question"><h3>${i+1}. ${q}</h3><div class="options">${['A. 選項一','B. 選項二','C. 選項三','D. 選項四'].map(x=>`<label><input type="radio" name="q${i}"> ${x}</label>`).join('')}</div></div>`).join('')}`}
    function essayBody(sub){const qs=prompts[sub]||prompts['景觀規劃'];return `<div class="notice">本科為申論／作圖型考科，請依正式考試時間安排作答。下方題目可作為${sub}的練習提示，完成後開啟原卷比對題意與配分。</div>${qs.map((q,i)=>`<div class="question"><h3>${i+1}. ${q}</h3><textarea class="essay" placeholder="在此輸入答題架構、關鍵字或繪圖說明……"></textarea></div>`).join('')}`}
    function updateTimer(){const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('#timer').textContent=`剩餘 ${m}:${s}`}
    function finish(){clearInterval(interval);alert('本次模擬已完成。請使用「查看官方原卷」與答案檔案進行檢核。');closeModal()}
    function closeModal(){clearInterval(interval);$('#modalWrap').classList.remove('show')}
    ['year','type','subject'].forEach(id=>$('#'+id).onchange=render);$('#closeModal').onclick=closeModal;$('#finish').onclick=finish;$('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')closeModal()};$('#randomStart').onclick=()=>{const r=records.filter(x=>!(x.year==='115'&&x.type.includes('地方')))[Math.floor(Math.random()*4)];openExam(r,'景觀規劃')};render();
  </script>
</body>
</html>
